    <!-- Products Section -->
    <section id="products" class="products">
        <!-- Header + controls in a centred wrapper -->
        <div class="container">
            <div class="section-header reveal">
                <h2>Our <span class="text-gradient">Products</span></h2>
                <p>See our different types of steel furniture</p>
            </div>

            <!-- Featured Product Carousel -->
            <div class="carousel-container reveal">
                <div class="carousel-track" id="carousel-track">
                    <!-- Carousel items injected by JS from products data below -->
                </div>
                <button class="carousel-btn prev-btn" id="prev-btn" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button>
                <button class="carousel-btn next-btn" id="next-btn" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>
                <div class="carousel-dots" id="carousel-dots"></div>
            </div>

            <!-- Enquire Now — single CTA above search -->
            <div class="enquire-bar reveal">
                <a href="index.html#contact" class="btn-enquire-pro">
                    <i class="fa-solid fa-phone-volume"></i>
                    <span>Enquire Now</span>
                </a>
            </div>

            <!-- Search and Filter -->
            <div class="product-controls reveal">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="product-search" placeholder="Search furniture...">
                </div>
                <div class="filter-buttons" id="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="home">Home</button>
                    <button class="filter-btn" data-filter="office">Office</button>
                    <button class="filter-btn" data-filter="custom">Custom</button>
                </div>
            </div>
        </div>

        <!-- Full-screen product cards — no container wrapper -->
        <div class="products-grid" id="products-grid">
            <!-- Product cards injected by JS from products data below -->
        </div>
    </section>



    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-bottom">
